services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
      POSTGRES_DB: nexus
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      retries: 10
    ports: ["5432:5432"]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
    ports: ["6379:6379"]

  bot:
    build: { context: ., target: bot }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
    volumes: [uploads:/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8081/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      start_period: 40s
    restart: unless-stopped

  web:
    build: { context: ., target: web }
    env_file: .env
    environment:
      DATABASE_URL: postgresql://nexus:nexus@postgres:5432/nexus
      REDIS_URL: redis://redis:6379
      UPLOAD_DIR: /data/uploads
      BOT_HEALTH_URL: http://bot:8081/health
    volumes: [uploads:/data/uploads]
    ports: ["3000:3000"]
    depends_on:
      bot: { condition: service_started }
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  uploads:
